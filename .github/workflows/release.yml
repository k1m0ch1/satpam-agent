name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist

          targets=(
            "linux   amd64  satpam-agent-linux-amd64"
            "linux   arm64  satpam-agent-linux-arm64"
            "windows amd64  satpam-agent-windows-amd64.exe"
            "darwin  amd64  satpam-agent-darwin-amd64"
            "darwin  arm64  satpam-agent-darwin-arm64"
          )

          for row in "${targets[@]}"; do
            read -r os arch out <<< "$row"
            echo "Building $out..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/$out ./cmd/satpam-agent
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/satpam-agent-linux-amd64
            dist/satpam-agent-linux-arm64
            dist/satpam-agent-windows-amd64.exe
            dist/satpam-agent-darwin-amd64
            dist/satpam-agent-darwin-arm64
